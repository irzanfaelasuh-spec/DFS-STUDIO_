name: Build DFS Optimization

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build jar
        shell: bash
        run: |
          set -o pipefail
          gradle build -x test --stacktrace --console=plain 2>&1 | tee build.log

      - name: Show the error
        if: failure()
        shell: bash
        run: |
          grep -n -E "error:|What went wrong|FAILED|Caused by" build.log | head -40 | tee -a $GITHUB_STEP_SUMMARY || true
          echo "-----"
          tail -n 60 build.log

      - name: Save full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Check jar contents
        run: |
          ls -l build/libs
          unzip -l build/libs/dfs-optimization-1.21.11-fabric.jar | grep -E "fabric.mod.json|icon.png|DfsOptimizationClient"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: dfs-optimization-1.21.11-fabric
          path: build/libs/dfs-optimization-1.21.11-fabric.jar

      - name: Unit tests
        run: gradle test --stacktrace
        continue-on-error: true
